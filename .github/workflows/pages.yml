# Rebuild the data from pintail's latest dataset and deploy the site to GitHub Pages.
# Runs daily after pintail's update, on pushes to main, and by hand. A failed step (fetch,
# sha256 mismatch, sanity check, build) skips the deploy, so the last good site stays up.
name: pages

on:
  schedule:
    - cron: '30 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: pintail-xyz/staking commit (default main)
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Paths
        run: |
          echo "DS=$RUNNER_TEMP/dataset" >> "$GITHUB_ENV"
          echo "DATA=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "PROBE=$RUNNER_TEMP/wa_probe.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Fetch pintail dataset (sha256-checked against its manifest)
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: python -I pipeline/fetch.py "$DS" "$REF"

      - name: Operator history and entity tables
        run: |
          mkdir -p "$DATA"
          python -I pipeline/history.py "$DS" "$DATA" --every 4
          python -I pipeline/tables.py "$DATA"

      # Withdrawal lens: needs proxy slots for each withdrawal address. Reads only addresses
      # missing from the cache. If the RPC fails, the committed withdrawals.json is kept.
      - name: Restore proxy-slot cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wa_probe.json
          key: wa-probe-${{ github.run_id }}
          restore-keys: wa-probe-
      - name: Withdrawal control
        id: wc
        continue-on-error: true
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
        run: |
          [ -f "$PROBE" ] || gunzip -c pipeline/wa_probe.seed.json.gz > "$PROBE"
          python -I pipeline/probe.py "$DS" "$PROBE"
          python -I pipeline/wc.py "$DS" "$PROBE" "$DATA"
      - name: Save proxy-slot cache
        if: steps.wc.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wa_probe.json
          key: wa-probe-${{ github.run_id }}

      - name: Export site data
        run: |
          python -I pipeline/export.py "$DS" "$DATA" site/public/data
          python -I pipeline/check.py site/public/data

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
